<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student List</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-success mb-4">
  <div class="container">
    <span class="navbar-brand mb-0 h1">Student Portal</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
    </form>
  </div>
</nav>

<div class="container">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="mb-0">Student List</h2>
    <a href="{% url 'student_create' %}" class="btn btn-success">+ Add Student</a>
  </div>

  <div class="card shadow-sm">
    <table class="table table-striped table-hover mb-0">
      <thead class="table-success">
        <tr>
          <th>Name</th>
          <th>Email</th>
          <th>Course</th>
          <th>Age</th>
          <th>Edit</th>
            <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for s in students %}
        <tr>
          <td>{{ s.name }}</td>
          <td>{{ s.email }}</td>
          <td>{{ s.course }}</td>
          <td>{{ s.age }}</td>
          <td><a href="{% url 'student_update' s.id %}" class="btn btn-sm btn-primary">Edit</a></td>
          <td><a href="{% url 'student_delete' s.id %}" class="btn btn-sm btn-danger">Delete</a></td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
</body>
</html>
